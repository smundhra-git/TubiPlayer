name: tubiplayer-critical-path
url: "${TARGET_URL}"
timeout: 30s
steps:
  - name: page-load
    action: navigate
    target: "${TARGET_URL}"
    assertions:
      - page_load_time: "< 15s"

  - name: verify-player-container
    action: wait
    selector: "[data-testid='tubi-player-container']"
    assertions:
      - selector: "[data-testid='tubi-player-container']"
        condition: exists

  - name: verify-video-element
    action: wait
    selector: "video.tubi-video-element"
    assertions:
      - selector: "video.tubi-video-element"
        condition: exists

  - name: no-console-errors
    action: check-console
    assertions:
      - error_count: 0

  - name: no-network-errors
    action: check-network
    assertions:
      - failed_requests: 0
      - ssl_errors: 0
