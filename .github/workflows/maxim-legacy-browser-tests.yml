name: Maxim Legacy Browser Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 864899829402.dkr.ecr.us-west-2.amazonaws.com
  TARGET_URL: https://tubitv.com

jobs:
  legacy-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Run Maxim legacy browser tests
        uses: tanagram/maxim@main
        with:
          url: ${{ env.TARGET_URL }}
          browsers: all
          parallel: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxim-results
          path: maxim-results/

      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: maxim-results/results.xml
          check_name: Legacy Browser Tests

      - name: Fail on legacy browser breakage
        if: steps.maxim.outputs.failed != '0'
        run: |
          echo "::error::Maxim detected ${{ steps.maxim.outputs.failed }} legacy browser test failure(s)"
          exit 1
